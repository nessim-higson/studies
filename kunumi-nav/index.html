<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F5F5" />
<title>Nevverland — organic nav (Kunumi finish)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400&display=swap');

  :root{
    --bg: #F5F5F5;
    --ink: #141414;
    --font: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'Space Mono', ui-monospace, monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background: var(--bg); color: var(--ink);
    font-family: var(--font); -webkit-font-smoothing: antialiased;
    overflow: hidden; user-select: none;
    cursor: url("data:image/svg+xml,%3Csvg width='8' height='8' viewBox='0 0 8 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='4' cy='4' r='4' fill='%231C1C1C'/%3E%3C/svg%3E") 4 4, auto;
  }
  #field{ position: fixed; inset: 0; z-index: 1; display:block; }

  /* the whole nav (threads + type + tiles + copy) lives in one wrapper so it
     can ease aside into a living miniature when a piece of work takes stage */
  #navwrap{
    position: fixed; inset: 0; z-index: 2;
    transform-origin: 26% 50%;
    transition: transform 1s cubic-bezier(.16,1,.3,1), opacity .6s ease;
  }
  body.staged #navwrap{ transform: scale(.4) translateX(-58%); opacity: .42; pointer-events: none; }

  #graph{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  #graph line{ vector-effect: non-scaling-stroke; transition: opacity .35s ease, stroke-width .35s ease; }

  .node{ cursor:pointer; }
  .node text{ transition: font-size .55s cubic-bezier(0.34,1.56,0.64,1), fill-opacity .4s ease; }
  .node .hit{ fill: transparent; }
  .node .anchor{ transition: r .5s ease; }

  /* image tiles (project imagery) */
  #tiles{ position:absolute; inset:0; pointer-events:none; }  /* never block clicks to the labels */
  .tile{
    position:absolute; width: 8rem; height: 8rem;
    transform: translate(-50%,-50%); padding:0; border:none; background:none;
    cursor:pointer; opacity:0; will-change: transform, opacity;
    pointer-events:auto;                                       /* but tiles themselves are clickable */
  }
  .tile .ti{ width:100%; height:100%; border-radius:1rem; overflow:hidden;
    box-shadow:0 8px 28px rgba(0,0,0,.10); transition: box-shadow .35s ease; }
  .tile:hover .ti{ box-shadow:0 16px 44px rgba(0,0,0,.18); }
  .tile img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* focus copy block — rides the active node's physics */
  #copy{
    position:absolute; max-width: 34rem; transform: translate(-50%,0);
    font-size: 1.4rem; line-height: 1.5; letter-spacing:-.01em;
    color: rgba(20,20,20,.55); text-align:center;
    opacity:0; transition: opacity .5s ease; pointer-events:none;
  }

  /* ---- stage (lightbox the nav shifts aside for) ---- */
  #stage{
    position: fixed; top:0; right:0; bottom:0; width: 64%; z-index: 15;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 2rem; padding: 5rem 4rem;
    opacity:0; visibility:hidden; pointer-events:none;
    transition: opacity .6s ease, visibility .6s;
  }
  body.staged #stage{ opacity:1; visibility:visible; pointer-events:auto; }
  #stage-img{ width:min(48rem,62vmin); height:min(48rem,62vmin);
    border-radius:1.6rem; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.20);
    transition: opacity .4s ease; }
  #stage-img img{ width:100%; height:100%; object-fit:cover; display:block; }
  #stage-meta{ text-align:center; }
  #stage-topic{ font-family:var(--mono); font-size:1.1rem; letter-spacing:.18em;
    text-transform:uppercase; color:rgba(20,20,20,.4); margin-bottom:.6rem; }
  #stage-title{ font-size:clamp(20px,2.4vw,28px); letter-spacing:-.02em; }
  #stage-strip{ display:flex; gap:1rem; margin-top:.4rem; }
  .sthumb{ width:5.4rem; height:5.4rem; border-radius:.8rem; overflow:hidden;
    cursor:pointer; border:none; padding:0; background:none;
    box-shadow:0 0 0 1px rgba(0,0,0,.06); opacity:.55;
    transition: opacity .3s ease, transform .3s cubic-bezier(.16,1,.3,1); }
  .sthumb.on{ opacity:1; box-shadow:0 0 0 2px rgba(20,20,20,.5); }
  .sthumb:hover{ opacity:1; transform: translateY(-3px); }
  .sthumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  #stage-close{ position:absolute; top:2.4rem; right:2.4rem; width:4rem; height:4rem;
    border-radius:999px; border:none; cursor:pointer; background:rgba(20,20,20,.08);
    color:var(--ink); font-size:1.8rem; display:flex; align-items:center; justify-content:center;
    transition: background .2s ease; }
  #stage-close:hover{ background:rgba(20,20,20,.16); }
  /* catcher over the miniature to step back */
  #mini-catch{ position:fixed; inset:0; width:36%; z-index:14; cursor:pointer;
    display:none; }
  body.staged #mini-catch{ display:block; }

  /* chrome */
  #brand{ position:fixed; top:2.4rem; left:2.4rem; z-index:20; font-size:1.3rem;
    letter-spacing:.01em; color:rgba(20,20,20,.5); font-family:var(--mono); text-transform:uppercase; }
  #hint{ position:fixed; bottom:2.4rem; left:0; right:0; z-index:5; text-align:center;
    font-size:1.15rem; letter-spacing:.04em; color:rgba(20,20,20,.3);
    font-family:var(--mono); pointer-events:none; transition:opacity .6s ease; }
  body.staged #hint{ opacity:0; }

  html{ font-size:62.5%; } body{ font-size:1.6rem; }
</style>
</head>
<body>
  <canvas id="field"></canvas>

  <div id="navwrap">
    <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="tiles"></div>
    <p id="copy"></p>
  </div>

  <div id="mini-catch"></div>

  <div id="stage">
    <button id="stage-close" aria-label="Close">&times;</button>
    <div id="stage-img"></div>
    <div id="stage-meta">
      <div id="stage-topic"></div>
      <div id="stage-title"></div>
    </div>
    <div id="stage-strip"></div>
  </div>

  <div id="brand">Nevverland</div>
  <div id="hint">click to enter · click the focus to step back</div>

<script>
/* ============================================================
   Nevverland organic navigation finished in the Kunumi visual
   language. Hand-rolled force model (ported from the d3 version),
   centered type cascade + dark gossamer threads on light, project
   imagery that blooms as tiles, and a stage the nav eases aside for.
   ============================================================ */

/* ---------------- Kunumi image pool ---------------- */
const COUNTS = { science:7, culture:6, intelligence:7, meaning:5, language:6, society:6 };
const POOL = [];
for(const [t,c] of Object.entries(COUNTS)) for(let i=1;i<=c;i++) POOL.push(`../kunumi/img/${t}-${i}.webp`);
let _poolI = 0;
const grab = (n) => Array.from({length:n}, () => POOL[(_poolI++) % POOL.length]);

/* ---------------- nav content (copy on the nodes that carry it) ---------------- */
const NAV = {
  id:'nevverland', label:'Nevverland',
  copy:'An experimental practice. Navigation as material, type as structure, imagery as weather.',
  children:[
    { id:'work', label:'Work', copy:'Studies in interfaces that behave like places.', children:[
      { id:'nike', label:'Nike', copy:'Motion identity sprints — twelve directions in ten days.' },
      { id:'hbo', label:'HBO', copy:'Title sequences as navigation. The menu is the trailer.' },
      { id:'sony', label:'Sony', copy:'Product stories told through a bent lens.' },
      { id:'pepsi', label:'Pepsi', copy:'A summer of colour, run as a live system.' },
      { id:'experimental', label:'Experimental', copy:'Off-brief studies — where the language gets invented.' },
    ]},
    { id:'about', label:'About', copy:'Who we are, how we think, the hands on the work.', children:[
      { id:'studio', label:'Studio' }, { id:'people', label:'People' }, { id:'process', label:'Process' },
    ]},
    { id:'info', label:'Info', copy:'The quiet pages — notes, credits, the archive.', children:[
      { id:'notes', label:'Notes' }, { id:'colophon', label:'Colophon' }, { id:'archive', label:'Archive' },
    ]},
    { id:'contact', label:'Contact', copy:'Where to find us, and how to start something.', children:[
      { id:'newyork', label:'New York' }, { id:'losangeles', label:'Los Angeles' }, { id:'email', label:'Email' },
    ]},
  ],
};

/* ---------------- flatten; leaves get imagery ---------------- */
const nodes = []; const byId = new Map();
(function walk(item, parentId, depth){
  const childIds = (item.children||[]).map(c=>c.id);
  const isLeaf = childIds.length === 0;
  const n = { id:item.id, label:item.label, copy:item.copy||null, parentId, depth, childIds, isLeaf,
              images: isLeaf ? grab(4) : null,
              x:0, y:0, vx:0, vy:0, phase:Math.random()*Math.PI*2, drift:0.5+Math.random(), shown:false };
  nodes.push(n); byId.set(n.id, n);
  (item.children||[]).forEach(c => walk(c, item.id, depth+1));
})(NAV, null, 0);

const ancestorsOf = id => { const out=[]; let c=byId.get(id); while(c&&c.parentId){ out.push(c.parentId); c=byId.get(c.parentId); } return out; };

/* ---------------- roles ---------------- */
function computeRoles(activeId){
  const roles = new Map(); const active = byId.get(activeId);
  roles.set(activeId,'active');
  for(const a of ancestorsOf(activeId)) roles.set(a,'parent');
  for(const c of active.childIds) roles.set(c,'child');
  if(active.parentId) for(const s of byId.get(active.parentId).childIds) if(!roles.has(s)) roles.set(s,'sibling');
  for(const a of ancestorsOf(activeId)){ const anc=byId.get(a); if(!anc.parentId) continue;
    for(const s of byId.get(anc.parentId).childIds) if(!roles.has(s)) roles.set(s,'distant'); }
  return roles;
}
const ROLE = {
  active:{fs:46,weight:700,op:1.0,ls:'-0.02em',scale:2.1},
  child:{fs:22,weight:500,op:0.95,ls:'0',scale:1.15},
  parent:{fs:15,weight:400,op:0.55,ls:'0.02em',scale:0.9},
  sibling:{fs:12,weight:400,op:0.4,ls:'0.03em',scale:0.7},
  distant:{fs:10,weight:400,op:0.25,ls:'0.04em',scale:0.5},
};
const labelHalfW = (label, fs) => label.length * fs * 0.29;

/* ---------------- physics ---------------- */
const P = {
  CHARGE:-560, CHARGE_MAX:460,
  LINK:{activeChild:160, breadcrumb:128, sibling:118, distant:135, image:210},
  LINK_STR:0.4, CHILD_RING:230, CHILD_RING_STR:0.30, IMAGE_RING:265,
  CENTER_ACTIVE:0.2, CENTER_OTHERS:0.014, ACTIVE_Y_BIAS:-30,
  BREADCRUMB_LIFT:188, BREADCRUMB_PULL:0.05,
  COLLIDE_STR:0.9, COLLIDE_PAD:16,
  DAMP:0.72, DRIFT:0.16, CURSOR:0.34, CURSOR_R:300, SHOCK:7.5,
  ALPHA_KICK:0.9, IDLE_ALPHA:0.04, ALPHA_DECAY:0.022,
};

let activeId='nevverland', roles=computeRoles(activeId), links=[], alpha=P.ALPHA_KICK,
    prevFocus=null, driftT=0, hoverId=null, imageNodes=[], live=[], liveById=new Map(),
    staged=false, stageProject=null, stageSrc=null;
const pointer={x:null,y:null};
const W=()=>innerWidth, H=()=>innerHeight;
nodes.forEach(n=>{ n.x=W()/2+(Math.random()-0.5)*60; n.y=H()/2+(Math.random()-0.5)*60; });

function rebuild(){
  roles = computeRoles(activeId);
  const visibleNav = nodes.filter(n=>roles.has(n.id));
  for(const n of visibleNav){
    if(!n.shown){ const p=n.parentId?byId.get(n.parentId):null;
      if(p&&p.shown){ n.x=p.x+(Math.random()-0.5)*40; n.y=p.y+(Math.random()-0.5)*40; } n.shown=true; }
  }
  // project imagery: a focused leaf blooms its images as tile-children
  imageNodes = [];
  const active = byId.get(activeId);
  if(active.isLeaf && active.images){
    active.images.forEach((src,i)=>{
      imageNodes.push({ id:`${activeId}#${i}`, isImage:true, src, parentId:activeId,
        x:active.x+(Math.random()-0.5)*30, y:active.y+(Math.random()-0.5)*30,
        vx:0, vy:0, phase:Math.random()*Math.PI*2, drift:0.5+Math.random(), _o:0 });
    });
  }
  live = [...visibleNav, ...imageNodes];
  liveById = new Map(live.map(n=>[n.id,n]));

  links = [];
  for(const n of visibleNav){
    if(!n.parentId || !roles.has(n.parentId)) continue;
    const r=roles.get(n.id);
    const kind = r==='child'?'activeChild' : (r==='active'||r==='parent')?'breadcrumb' : r==='sibling'?'sibling':'distant';
    links.push({s:n.parentId, t:n.id, kind});
  }
  for(const im of imageNodes) links.push({s:activeId, t:im.id, kind:'image'});

  const f=byId.get(activeId);
  if(prevFocus && prevFocus!==activeId && f.x!=null){
    for(const n of live){ if(n===f) continue;
      const dx=n.x-f.x, dy=n.y-f.y, d=Math.hypot(dx,dy)||1, imp=P.SHOCK*Math.min(1,220/d);
      n.vx+=dx/d*imp; n.vy+=dy/d*imp; }
  }
  prevFocus=activeId; alpha=P.ALPHA_KICK;
  buildSVG(); buildTiles();
}

function tick(){
  alpha += (P.IDLE_ALPHA-alpha)*P.ALPHA_DECAY;
  const a=alpha, cx=W()/2, cy=H()/2, active=byId.get(activeId);

  for(const n of live){
    const r = n.isImage ? 'image' : roles.get(n.id);
    const cxs = r==='active'?P.CENTER_ACTIVE:P.CENTER_OTHERS;
    n.vx += (cx-n.x)*cxs*a;
    const ty = r==='parent' ? cy-P.BREADCRUMB_LIFT : r==='active' ? cy+P.ACTIVE_Y_BIAS : cy;
    const cys = r==='active'?P.CENTER_ACTIVE : r==='parent'?P.BREADCRUMB_PULL : P.CENTER_OTHERS;
    n.vy += (ty-n.y)*cys*a;
  }
  // charge
  for(let i=0;i<live.length;i++) for(let j=i+1;j<live.length;j++){
    const A=live[i],B=live[j]; let dx=B.x-A.x,dy=B.y-A.y,d2=dx*dx+dy*dy;
    if(d2<1){ dx=Math.cos(A.phase); dy=Math.sin(A.phase); d2=1; }
    const d=Math.sqrt(d2); if(d>P.CHARGE_MAX) continue;
    const sA=A.isImage?1.4:ROLE[roles.get(A.id)].scale, sB=B.isImage?1.4:ROLE[roles.get(B.id)].scale;
    const w=P.CHARGE*a*(sA+sB)*0.5/d2;
    A.vx+=dx/d*w; A.vy+=dy/d*w; B.vx-=dx/d*w; B.vy-=dy/d*w;
  }
  // link springs
  for(const l of links){
    const s=liveById.get(l.s), t=liveById.get(l.t); if(!s||!t) continue;
    let dx=t.x-s.x,dy=t.y-s.y,d=Math.hypot(dx,dy)||1;
    const k=(d-P.LINK[l.kind])/d*a*P.LINK_STR;
    s.vx+=dx*k*0.5; s.vy+=dy*k*0.5; t.vx-=dx*k*0.5; t.vy-=dy*k*0.5;
  }
  // child / image ring around the active node
  for(const n of live){
    const isImg=n.isImage, isChild=!isImg && roles.get(n.id)==='child';
    if(!isImg && !isChild) continue;
    let dx=n.x-active.x, dy=n.y-active.y, d=Math.hypot(dx,dy);
    if(d<1){ dx=Math.cos(n.phase); dy=Math.sin(n.phase); d=1; }
    const ring=isImg?P.IMAGE_RING:P.CHILD_RING;
    const k=(ring-d)/d*P.CHILD_RING_STR*a;
    n.vx+=dx*k; n.vy+=dy*k;
  }
  // collide
  for(let i=0;i<live.length;i++) for(let j=i+1;j<live.length;j++){
    const A=live[i],B=live[j];
    const ra=A.isImage?52:Math.max(labelHalfW(A.label,ROLE[roles.get(A.id)].fs),ROLE[roles.get(A.id)].fs*0.7)+P.COLLIDE_PAD*0.5;
    const rb=B.isImage?52:Math.max(labelHalfW(B.label,ROLE[roles.get(B.id)].fs),ROLE[roles.get(B.id)].fs*0.7)+P.COLLIDE_PAD*0.5;
    let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1, min=ra+rb;
    if(d<min){ const push=(min-d)/d*P.COLLIDE_STR*0.5;
      A.vx-=dx*push; A.vy-=dy*push; B.vx+=dx*push; B.vy+=dy*push; }
  }
  // drift
  driftT+=0.006;
  for(const n of live){ n.vx+=Math.cos(driftT*n.drift+n.phase)*P.DRIFT*0.1; n.vy+=Math.sin(driftT*n.drift*1.37+n.phase)*P.DRIFT*0.1; }
  // cursor gravity (suspended while staged)
  if(pointer.x!=null && !staged){
    for(const n of live){ const dx=pointer.x-n.x,dy=pointer.y-n.y,d=Math.hypot(dx,dy);
      if(d>P.CURSOR_R||d<2) continue; const k=P.CURSOR*(1-d/P.CURSOR_R)*0.18; n.vx+=dx/d*k; n.vy+=dy/d*k; }
  }
  // soft walls + integrate
  const m=90;
  for(const n of live){
    if(n.x<m) n.vx+=(m-n.x)*0.4*a; if(n.x>W()-m) n.vx-=(n.x-(W()-m))*0.4*a;
    if(n.y<m) n.vy+=(m-n.y)*0.4*a; if(n.y>H()-m) n.vy-=(n.y-(H()-m))*0.4*a;
    n.vx*=P.DAMP; n.vy*=P.DAMP; n.x+=n.vx; n.y+=n.vy;
    if(n.isImage) n._o += (1-n._o)*0.12;
  }
  renderGraph();
}

/* ---------------- SVG / tiles ---------------- */
const svg=document.getElementById('graph'), tilesEl=document.getElementById('tiles'),
      copyEl=document.getElementById('copy'), NS='http://www.w3.org/2000/svg';
let lineEls=[]; const nodeEls={}; let tileEls=[];

function makeNodeEl(n){
  const g=document.createElementNS(NS,'g'); g.setAttribute('class','node'); g.dataset.id=n.id;
  const hit=document.createElementNS(NS,'rect'); hit.setAttribute('class','hit');
  const anchor=document.createElementNS(NS,'circle'); anchor.setAttribute('class','anchor');
  const text=document.createElementNS(NS,'text'); text.setAttribute('text-anchor','middle');
  text.setAttribute('dominant-baseline','central'); text.setAttribute('fill','#141414'); text.textContent=n.label;
  g.append(hit,anchor,text);
  g.addEventListener('mouseenter',()=>hoverId=n.id); g.addEventListener('mouseleave',()=>hoverId=null);
  g.addEventListener('click',e=>{ e.stopPropagation(); navigate(n); });
  svg.appendChild(g); return {g,hit,anchor,text};
}
nodes.forEach(n=>nodeEls[n.id]=makeNodeEl(n));

function buildSVG(){
  lineEls.forEach(l=>l.remove());
  lineEls = links.map(l=>{ const ln=document.createElementNS(NS,'line');
    ln.dataset.s=l.s; ln.dataset.t=l.t; ln.dataset.kind=l.kind;
    svg.insertBefore(ln, svg.firstChild); return ln; });
}
function buildTiles(){
  tileEls.forEach(t=>t.el.remove()); tileEls=[];
  for(const im of imageNodes){
    const b=document.createElement('button'); b.className='tile';
    b.innerHTML=`<span class="ti"><img src="${im.src}" alt="" loading="lazy"></span>`;
    b.addEventListener('click',e=>{ e.stopPropagation(); enterStage(im.src); });
    tilesEl.appendChild(b); tileEls.push({el:b, node:im});
  }
}
const trailSet=()=>new Set([activeId,...ancestorsOf(activeId)]);

function renderGraph(){
  const trail=trailSet();
  for(const ln of lineEls){
    const s=liveById.get(ln.dataset.s), t=liveById.get(ln.dataset.t); if(!s||!t) continue;
    ln.setAttribute('x1',s.x); ln.setAttribute('y1',s.y); ln.setAttribute('x2',t.x); ln.setAttribute('y2',t.y);
    const onTrail=trail.has(s.id)&&trail.has(t.id);
    const lit=hoverId===s.id||hoverId===t.id;
    const isImg=ln.dataset.kind==='image';
    ln.setAttribute('stroke','rgba(20,20,20,1)');
    ln.setAttribute('stroke-width', lit?1.1:0.6);
    ln.setAttribute('opacity', lit?0.5 : isImg?0.18 : onTrail?0.26 : 0.10);
  }
  for(const n of nodes){
    const el=nodeEls[n.id]; const role=roles.get(n.id);
    if(!role){ el.g.style.display='none'; continue; } el.g.style.display='';
    const r=ROLE[role], hov=hoverId===n.id;
    el.g.setAttribute('transform',`translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
    el.g.style.opacity = hov?Math.min(1,r.op+0.35):r.op;
    el.text.setAttribute('font-size',r.fs); el.text.setAttribute('font-weight',r.weight); el.text.setAttribute('letter-spacing',r.ls);
    const half=labelHalfW(n.label,r.fs);
    el.anchor.setAttribute('cx',0); el.anchor.setAttribute('cy',r.fs*0.62+5);
    el.anchor.setAttribute('r',role==='active'?2.4:1.8);
    el.anchor.setAttribute('fill','rgba(20,20,20,'+(role==='active'?0.85:0.5)+')');
    el.hit.setAttribute('x',-half-16); el.hit.setAttribute('y',-r.fs);
    el.hit.setAttribute('width',half*2+32); el.hit.setAttribute('height',r.fs*2.2);
  }
  for(const {el,node} of tileEls){
    el.style.left=node.x+'px'; el.style.top=node.y+'px'; el.style.opacity=node._o.toFixed(2);
    el.style.transform=`translate(-50%,-50%) scale(${(0.7+0.3*node._o).toFixed(3)})`;
  }
  // focus copy block rides the active node
  const active=byId.get(activeId);
  if(active.copy && active.x!=null){
    const fs=ROLE.active.fs;
    copyEl.textContent=active.copy;
    copyEl.style.left=active.x+'px'; copyEl.style.top=(active.y+fs*0.62+18)+'px';
    copyEl.style.opacity = staged?0:0.9;
  } else copyEl.style.opacity=0;
}

/* ---------------- starfield + threads into the field ---------------- */
const canvas=document.getElementById('field'), ctx=canvas.getContext('2d'); let DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,1.5); canvas.width=W()*DPR; canvas.height=H()*DPR; canvas.style.width=W()+'px'; canvas.style.height=H()+'px'; }
resize(); addEventListener('resize',resize);
const STAR_N=150, STAR_SPEED=0.0003, stars=[];
function placeStar(s){ s.x=Math.random()*2-1; s.y=Math.random()*2-1; s.z=Math.random()*0.85+0.15; s.b=Math.random()*0.5+0.4; s.sx=-9; s.sy=-9; }
for(let i=0;i<STAR_N;i++){ const s={}; placeStar(s); stars.push(s); }
function drawField(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const cx=W()/2, cy=H()/2;
  for(const s of stars){
    s.z-=STAR_SPEED; if(s.z<=0.12){ placeStar(s); s.z=1; continue; }
    const sx=cx+(s.x/s.z)*cx, sy=cy+(s.y/s.z)*cy; s.sx=sx; s.sy=sy;
    if(sx<-8||sx>W()+8||sy<-8||sy>H()+8) continue;
    const near=1-s.z, rad=s.b*(near*2.0)+0.4;
    ctx.beginPath(); ctx.arc(sx*DPR,sy*DPR,rad*DPR,0,Math.PI*2);
    ctx.fillStyle=`rgba(20,20,20,${(0.16+near*0.4).toFixed(2)})`; ctx.fill();
  }
  // the nav reaches into the field: thread the active node (+ children) to nearby dots
  if(!staged){
    const reach=[byId.get(activeId), ...live.filter(n=>!n.isImage && roles.get(n.id)==='child')];
    for(const node of reach){
      if(node.x==null) continue; let drawn=0;
      for(const s of stars){
        if(s.sx<0) continue; const d=Math.hypot(s.sx-node.x, s.sy-node.y);
        if(d<150){ ctx.beginPath(); ctx.moveTo(node.x*DPR,node.y*DPR); ctx.lineTo(s.sx*DPR,s.sy*DPR);
          ctx.strokeStyle=`rgba(20,20,20,${(0.12*(1-d/150)).toFixed(3)})`; ctx.lineWidth=0.6*DPR; ctx.stroke();
          if(++drawn>=2) break; }
      }
    }
  }
}

/* ---------------- interaction ---------------- */
function navigate(n){
  if(staged){ exitStage(); return; }
  const next = n.id===activeId ? n.parentId : n.id;
  if(!next) return;
  activeId=next; document.getElementById('hint').style.opacity='0'; rebuild();
}
addEventListener('mousemove',e=>{ pointer.x=e.clientX; pointer.y=e.clientY; });
addEventListener('mouseleave',()=>{ pointer.x=null; pointer.y=null; });

/* ---------------- stage ---------------- */
const stageImg=document.getElementById('stage-img'), stageTopic=document.getElementById('stage-topic'),
      stageTitle=document.getElementById('stage-title'), stageStrip=document.getElementById('stage-strip');
function enterStage(src){
  const active=byId.get(activeId); stageProject=active; stageSrc=src; staged=true;
  document.body.classList.add('staged');
  renderStage();
}
function renderStage(){
  if(!stageProject) return;
  stageImg.innerHTML=`<img src="${stageSrc}" alt="">`;
  stageTopic.textContent=stageProject.label;
  stageTitle.textContent=stageProject.copy || stageProject.label;
  stageStrip.innerHTML='';
  for(const src of stageProject.images){
    const b=document.createElement('button'); b.className='sthumb'+(src===stageSrc?' on':'');
    b.innerHTML=`<img src="${src}" alt="">`;
    b.addEventListener('click',e=>{ e.stopPropagation(); stageSrc=src; renderStage(); });
    stageStrip.appendChild(b);
  }
}
function exitStage(){ staged=false; stageProject=null; document.body.classList.remove('staged'); }
document.getElementById('stage-close').addEventListener('click',e=>{ e.stopPropagation(); exitStage(); });
document.getElementById('mini-catch').addEventListener('click',exitStage);
document.getElementById('stage').addEventListener('click',e=>{ if(e.target.id==='stage') exitStage(); });
addEventListener('keydown',e=>{ if(e.key==='Escape') exitStage(); });

/* ---------------- loop ---------------- */
function loop(){ drawField(); tick(); requestAnimationFrame(loop); }
rebuild(); loop();
</script>
</body>
</html>
