<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMPRESSION — one work, nine states</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hud hud-top">
  <div class="hud-block">
    <span class="hud-strong">COMPRESSION</span>
    <span class="hud-dim">one work, nine states of reveal</span>
  </div>
  <div class="hud-block hud-right">
    <span class="hud-dim">study after Molly.studio, “Primal”</span>
    <span class="hud-strong">001</span>
  </div>
</header>

<main id="stage" aria-live="polite"></main>
<div id="ghosts" aria-hidden="true"></div>

<footer class="hud hud-bottom">
  <div class="stepper" id="stepper"></div>
  <div class="controls">
    <button class="ctrl" id="prev" aria-label="Previous state">&#8249;</button>
    <button class="ctrl" id="next" aria-label="Next state">&#8250;</button>
    <button class="ctrl ctrl-auto" id="auto" aria-pressed="false">AUTO</button>
  </div>
  <div class="readout" id="readout"></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
<script src="main.js"></script>
</body>
</html>
